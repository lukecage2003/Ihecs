:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f5f5f7;
  --surface-3: #e8e8ed;
  --fg: #1d1d1f;
  --fg-2: #6e6e73;
  --fg-3: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.14);
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: rgba(0, 113, 227, 0.1);
  --on-accent: #ffffff;
  --good: #248a3d;
  --good-soft: rgba(52, 199, 89, 0.14);
  --warn: #b25000;
  --warn-soft: rgba(255, 149, 0, 0.14);
  --bad: #d70015;
  --bad-soft: rgba(255, 59, 48, 0.12);
  --glass: rgba(246, 246, 248, 0.72);
  --glass-strong: rgba(255, 255, 255, 0.82);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.14);
  --overlay: rgba(0, 0, 0, 0.28);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r-sm: 10px;
  --r: 18px;
  --r-lg: 24px;
  --sidebar-w: 264px;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --fg: #f5f5f7;
    --fg-2: #a1a1a6;
    --fg-3: #8e8e93;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --accent: #2997ff;
    --accent-hover: #47a6ff;
    --accent-soft: rgba(41, 151, 255, 0.16);
    --on-accent: #ffffff;
    --good: #30d158;
    --good-soft: rgba(48, 209, 88, 0.16);
    --warn: #ffb340;
    --warn-soft: rgba(255, 159, 10, 0.16);
    --bad: #ff6961;
    --bad-soft: rgba(255, 69, 58, 0.16);
    --glass: rgba(28, 28, 30, 0.72);
    --glass-strong: rgba(28, 28, 30, 0.86);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.6);
    --overlay: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --fg: #f5f5f7;
  --fg-2: #a1a1a6;
  --fg-3: #8e8e93;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --accent: #2997ff;
  --accent-hover: #47a6ff;
  --accent-soft: rgba(41, 151, 255, 0.16);
  --on-accent: #ffffff;
  --good: #30d158;
  --good-soft: rgba(48, 209, 88, 0.16);
  --warn: #ffb340;
  --warn-soft: rgba(255, 159, 10, 0.16);
  --bad: #ff6961;
  --bad-soft: rgba(255, 69, 58, 0.16);
  --glass: rgba(28, 28, 30, 0.72);
  --glass-strong: rgba(28, 28, 30, 0.86);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.6);
  --overlay: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; border-radius: 8px; box-shadow: 0 0 0 1px var(--accent); }
[hidden] { display: none !important; }
svg { flex-shrink: 0; }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 6px;
  padding: 22px 12px 16px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 14px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(160deg, #3a8dff, #0058c7); color: #fff;
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.02em; line-height: 1.1; }
.brand-sub { font-size: 12px; color: var(--fg-3); }

.search-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; margin-bottom: 8px; border-radius: 9px;
  background: var(--surface-3); border: 0; color: var(--fg-3); font-size: 14px; text-align: left;
}
.search-btn kbd { margin-left: auto; font-family: var(--font); font-size: 12px; color: var(--fg-3); }

.nav-label { padding: 14px 10px 4px; font-size: 11px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
  color: var(--fg); font-size: 14px; text-decoration: none; min-width: 0;
}
.nav a span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.nav a:hover { background: var(--line); }
.nav a.active { background: var(--accent); color: var(--on-accent); }
.nav a.active .nav-ico { color: var(--on-accent); }
.nav a.active .badge { background: rgba(255,255,255,.25); color: #fff; }
.nav-ico { color: var(--accent); display: grid; place-items: center; }
.nav-dot { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
.nav-dot svg { width: 13px; height: 13px; }
.badge {
  font-size: 12px; font-weight: 600; min-width: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--surface-3); color: var(--fg-2); text-align: center; font-variant-numeric: tabular-nums;
}
.sidebar-foot { margin-top: auto; padding: 12px 10px 0; font-size: 12px; color: var(--fg-3); }

.main { min-width: 0; padding-block: 36px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.view { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tabbar { display: none; }
.mobile-top { display: none; }

/* ---------- Typo ---------- */
.eyebrow { font-size: 13px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; }
.h-large { font-family: var(--font-display); font-size: clamp(30px, 4.2vw, 44px); line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; margin: 4px 0 0; text-wrap: balance; }
.h-sec { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.h-card { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
.muted { color: var(--fg-2); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
.page-head .lead { color: var(--fg-2); font-size: 17px; margin: 8px 0 0; max-width: 62ch; }
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-head a { font-size: 15px; }

/* ---------- Composants ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card-flat { background: var(--surface); border-radius: var(--r); padding: 22px; border: 1px solid var(--line); }
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 18px; border-radius: 980px; border: 0; font-size: 15px; font-weight: 500;
  background: var(--accent); color: var(--on-accent); text-decoration: none; white-space: nowrap;
  transition: background .2s var(--ease), transform .1s var(--ease);
}
.btn:hover { background: var(--accent-hover); text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn-ghost { background: var(--accent-soft); color: var(--accent); }
.btn-ghost:hover { background: var(--accent-soft); filter: brightness(1.05); }
.btn-plain { background: var(--surface-2); color: var(--fg); }
.btn-plain:hover { background: var(--surface-3); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.btn-lg { padding: 12px 24px; font-size: 17px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link-btn { background: none; border: 0; color: var(--accent); padding: 0; font-size: 15px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 980px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-info { background: var(--accent-soft); color: var(--accent); }
.pill-neutral { background: var(--surface-2); color: var(--fg-2); }

.icon-tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.icon-tile svg { width: 22px; height: 22px; }
.icon-tile.lg { width: 64px; height: 64px; border-radius: 16px; }
.icon-tile.lg svg { width: 32px; height: 32px; }

.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .6s var(--ease); }

.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-track { stroke: var(--surface-3); }
.ring .ring-val { transition: stroke-dashoffset .9s var(--ease); }
.ring .ring-label { position: absolute; text-align: center; font-variant-numeric: tabular-nums; }

.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: 14px;
  background: var(--accent-soft); color: var(--fg); font-size: 14px; margin-bottom: 24px;
}
.banner svg { color: var(--accent); margin-top: 2px; }
.banner b { font-weight: 600; }

/* ---------- Tableau de bord ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.hero-exam {
  position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 28px; color: #fff;
  background: linear-gradient(140deg, var(--hero-a, #0a84ff) 0%, var(--hero-b, #0040a8) 100%);
  display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-height: 240px;
}
.hero-exam::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); pointer-events: none;
}
.hero-exam .eyebrow { color: rgba(255,255,255,.75); }
.hero-exam .h-exam { font-family: var(--font-display); font-size: clamp(24px, 3vw, 32px); font-weight: 700; letter-spacing: -0.025em; margin: 6px 0 0; line-height: 1.15; text-wrap: balance; }
.hero-exam .meta { color: rgba(255,255,255,.82); font-size: 15px; margin-top: 4px; }
.countdown { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
.countdown .num { font-family: var(--font-display); font-size: clamp(54px, 7vw, 76px); font-weight: 700; line-height: .9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.countdown .unit { font-size: 15px; color: rgba(255,255,255,.8); margin-top: 6px; }
.hero-exam .btn { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(10px); }
.hero-exam .btn:hover { background: rgba(255,255,255,.3); }

.overall { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.overall-top { display: flex; align-items: center; gap: 20px; }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.stat { display: flex; flex-direction: column; gap: 6px; }
.stat-top { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 13px; font-weight: 500; }
.stat-top svg { width: 18px; height: 18px; }
.stat-val { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-val small { font-size: 16px; font-weight: 600; color: var(--fg-3); letter-spacing: 0; }
.stat a, .stat button.link-btn { font-size: 14px; margin-top: 2px; text-align: left; }

.subject-card {
  display: flex; flex-direction: column; gap: 16px; color: var(--fg); text-decoration: none;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.subject-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); text-decoration: none; }
.subject-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.subject-card .name { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; }
.subject-card .prof { font-size: 13px; color: var(--fg-3); margin-top: 2px; }
.subject-card .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-2); margin-top: -6px; }

.task-list { display: flex; flex-direction: column; }

## Trois grandes périodes
L'étude des effets des médias suit un mouvement de balancier : on pense d'abord que les médias sont tout-puissants, puis que leurs effets sont limités, puis on revient à des effets puissants mais indirects, à long terme.

## 1. Les effets puissants (années 1920-1940)
Après la propagande de la Première Guerre mondiale, on imagine que le message agit directement sur chaque individu, comme une piqûre : c'est la théorie de la **seringue hypodermique** (ou de la *balle magique*). Lasswell étudie la propagande dès 1927.

> **Exemple souvent cité** : l'émission radio *La Guerre des mondes* d'Orson Welles (1938). La « panique générale » a été largement exagérée par la presse de l'époque, ce qui montre les limites du modèle.

## 2. Les effets limités (années 1940-1960)
Paul Lazarsfeld, Bernard Berelson et Hazel Gaudet étudient l'élection présidentielle américaine de 1940 dans le comté d'Erie (*The People's Choice*, 1944). Résultat : les médias changent très peu les opinions ; ils les **renforcent** surtout.

Ils proposent le **two-step flow** (communication à deux étages) : les messages des médias atteignent d'abord des **leaders d'opinion**, qui les relaient ensuite dans leur entourage. Katz et Lazarsfeld développent cette idée dans *Personal Influence* (1955).

## 3. Le public actif : usages et gratifications
Avec Elihu Katz, Jay Blumler et Michael Gurevitch (1974), la question change : on ne demande plus ce que les médias font aux gens, mais ==ce que les gens font avec les médias==. Le public choisit les médias pour satisfaire des besoins : s'informer, se divertir, construire son identité, entretenir des relations.

## 4. Le retour des effets puissants (années 1970)
| Théorie | Auteurs | Idée centrale |
|---|---|---|
| Agenda-setting | McCombs et Shaw (1972) | Les médias ne disent pas quoi penser, mais **à quoi penser**. |
| Cultivation | Gerbner (années 1970) | Une forte exposition à la télévision façonne la vision du monde (« syndrome du grand méchant monde »). |
| Spirale du silence | Noelle-Neumann (1974) | Par peur de l'isolement, les personnes qui se croient minoritaires se taisent, ce qui renforce l'opinion perçue comme dominante. |

> **Astuce d'examen** : pour l'agenda-setting, cite l'étude de McCombs et Shaw sur l'élection de 1968 à Chapel Hill, et la formule de Bernard Cohen (1963) qui l'a inspirée.

## Les sources
La liberté d'expression est protégée à deux niveaux en Belgique.

- **Constitution belge** : l'**article 19** garantit la liberté de manifester ses opinions en toute matière, sauf la répression des délits commis à cette occasion. L'**article 25** garantit la liberté de la presse : ==la censure ne pourra jamais être établie==.
- **Convention européenne des droits de l'homme (CEDH, 1950)** : l'**article 10** protège la liberté d'expression, qui comprend la liberté d'opinion et la liberté de recevoir ou de communiquer des informations ou des idées.

## Une liberté qui n'est pas absolue
L'article 10, paragraphe 2, admet des restrictions, mais seulement si elles respectent **trois conditions cumulatives** :

1. être **prévues par la loi** (loi accessible et prévisible) ;
2. poursuivre un **but légitime** (sécurité nationale, protection de la réputation ou des droits d'autrui, etc.) ;
3. être **nécessaires dans une société démocratique** (répondre à un besoin social impérieux et être proportionnées).

> **Arrêt clé** : *Handyside c. Royaume-Uni* (CEDH, 7 décembre 1976). La liberté d'expression vaut aussi pour les idées « qui heurtent, choquent ou inquiètent ». C'est une exigence du pluralisme et de la tolérance.

## Les spécificités belges pour la presse
- **Interdiction de la censure préalable** (art. 25) : on ne peut pas contrôler un écrit avant sa publication.
- **Responsabilité en cascade** (art. 25, al. 2) : si l'auteur est connu et domicilié en Belgique, l'éditeur, l'imprimeur et le distributeur ne peuvent pas être poursuivis.
- **Délit de presse** (art. 150) : il relève de la cour d'assises, avec un jury. Depuis la révision de 1999, les délits de presse inspirés par le racisme ou la xénophobie relèvent du tribunal correctionnel.

## La protection des sources
La Cour européenne la considère comme une « pierre angulaire » de la liberté de la presse (*Goodwin c. Royaume-Uni*, 1996). En Belgique, la **loi du 7 avril 2005** permet aux journalistes de taire leurs sources, sauf exceptions strictes (prévenir des infractions graves contre l'intégrité physique).
`,

## Le droit au respect de la vie privée
Il est garanti par l'**article 8 de la CEDH** et l'**article 22 de la Constitution belge**. Il entre souvent en conflit avec la liberté d'expression (art. 10) : le juge doit alors **mettre en balance** les deux droits.

> **Critère clé** : la publication contribue-t-elle à un **débat d'intérêt général** ? (CEDH, *Von Hannover c. Allemagne*, 2004 : des photos de la vie quotidienne d'une princesse n'y contribuent pas.)

## Le droit à l'image
En droit belge, il repose sur l'**article XI.174 du Code de droit économique** : on ne peut pas reproduire ni communiquer au public le portrait d'une personne sans son **consentement**.

- Le consentement porte séparément sur la **prise** de l'image et sur sa **diffusion**.
- Il est **spécial** : un accord donné pour un usage ne vaut pas pour un autre (une photo de classe n'autorise pas une publicité).
- Après le décès, l'accord des proches reste nécessaire pendant **20 ans**.

**Exceptions admises par la jurisprudence** :
- personnalité publique photographiée dans l'exercice de ses fonctions ;
- personne prise dans un événement public ou d'actualité, ou dans une foule, sans être isolée ;
- personne qui apparaît de façon accessoire dans l'image.

## Le RGPD
Le **règlement (UE) 2016/679**, applicable depuis le **25 mai 2018**, encadre le traitement des données personnelles. Principes : licéité, limitation des finalités, minimisation des données, exactitude, conservation limitée, sécurité. Droits des personnes : accès, rectification, effacement (==« droit à l'oubli »==, art. 17), opposition, portabilité.

L'**article 85** prévoit des exemptions pour le traitement à des fins **journalistiques**, pour concilier protection des données et liberté d'expression.

## La demande
La **demande** est la quantité d'un bien que les acheteurs veulent et peuvent acheter à chaque prix. ==Loi de la demande== : toutes choses égales par ailleurs, quand le prix augmente, la quantité demandée diminue. La courbe de demande est donc **décroissante**.

## L'offre
L'**offre** est la quantité que les producteurs veulent vendre à chaque prix. Quand le prix augmente, produire devient plus rentable : la quantité offerte augmente. La courbe d'offre est **croissante**.

## Mouvement le long de la courbe ou déplacement de la courbe ?
| Ce qui change | Effet |
|---|---|
| Le **prix** du bien lui-même | Mouvement **le long** de la courbe |
| Le revenu, les goûts, le prix des autres biens, les attentes | **Déplacement** de la courbe de demande |
| Le coût de production, la technologie, le nombre de producteurs | **Déplacement** de la courbe d'offre |

> **Piège fréquent** : « le prix augmente, donc la demande baisse » est faux. C'est la **quantité demandée** qui baisse ; la demande (la courbe) ne bouge pas.

## L'équilibre
L'équilibre est atteint au prix où la quantité demandée est égale à la quantité offerte.

**Exemple** : demande Qd = 100 − 2P et offre Qs = 20 + 2P.
On pose 100 − 2P = 20 + 2P, donc 80 = 4P et **P\\* = 20 €**. On trouve **Q\\* = 60**.

- Au-dessus de P\\* : **excédent d'offre** (surplus), le prix tend à baisser.
- En dessous de P\\* : **excédent de demande** (pénurie), le prix tend à monter.

## L'élasticité-prix de la demande
Elle mesure la sensibilité de la quantité demandée au prix :

**Élasticité = variation en % de la quantité ÷ variation en % du prix**

Exemple : le prix passe de 2,00 € à 2,20 € (+10 %) et la quantité de 1 000 à 900 (−10 %). L'élasticité vaut −1 : la demande est **unitaire**.

| Valeur absolue | Demande | Exemple typique |
|---|---|---|
| Plus grande que 1 | Élastique | Biens de luxe, biens avec beaucoup de substituts |
| Égale à 1 | Unitaire | — |
| Plus petite que 1 | Inélastique | Biens de première nécessité, carburant, tabac |
